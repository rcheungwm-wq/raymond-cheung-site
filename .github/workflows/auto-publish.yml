name: Auto-publish scheduled posts

on:
  schedule:
    - cron: '0 23 * * *'   # 7:00 AM SGT (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run publish script
        id: publish
        run: |
          OUTPUT=$(node scripts/publish-next.mjs)
          echo "$OUTPUT"
          echo "output=$OUTPUT" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/insights.json data/queue.json
          if git diff --staged --quiet; then
            echo "No posts due today"
          else
            git commit -m "auto: publish ${{ steps.publish.outputs.output }}"
            git push
          fi

      - name: Ping IndexNow for new post
        if: ${{ steps.publish.outputs.output != 'no-posts' }}
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"host\": \"raymondcheungwm.com\",
              \"key\": \"7c3e1f9a2b5d8e4c0f6a3b9d1e7c2f5a\",
              \"keyLocation\": \"https://raymondcheungwm.com/7c3e1f9a2b5d8e4c0f6a3b9d1e7c2f5a.txt\",
              \"urlList\": [\"https://raymondcheungwm.com/insights/${{ steps.publish.outputs.output }}\"]
            }"
