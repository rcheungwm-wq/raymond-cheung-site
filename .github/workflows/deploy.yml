name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  ping:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Ping Google sitemap
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://raymondcheungwm.com/sitemap.xml"
          echo "Google pinged"

      - name: Ping Bing sitemap
        run: |
          curl -s "https://www.bing.com/ping?sitemap=https://raymondcheungwm.com/sitemap.xml"
          echo "Bing pinged"

      - name: Notify IndexNow
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "raymondcheungwm.com",
              "key": "7c3e1f9a2b5d8e4c0f6a3b9d1e7c2f5a",
              "keyLocation": "https://raymondcheungwm.com/7c3e1f9a2b5d8e4c0f6a3b9d1e7c2f5a.txt",
              "urlList": [
                "https://raymondcheungwm.com/",
                "https://raymondcheungwm.com/insights"
              ]
            }'
          echo "IndexNow notified"
